AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Aagman ERP API — FastAPI on Lambda behind HTTP API (existing VPC, RDS, S3).

Parameters:
  CorsOrigins:
    Type: String
    Description: Comma-separated browser origins (Amplify app URL).
  DatabaseHost:
    Type: String
    Description: RDS or RDS Proxy hostname.
  DatabasePort:
    Type: String
    Default: "5432"
  DatabaseName:
    Type: String
    Default: aagman_erp
  DatabaseUser:
    Type: String
    Default: postgres
  DatabasePassword:
    Type: String
    NoEcho: true
    Description: RDS password (set as Lambda env DATABASE_PASSWORD).
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: JWT signing secret (set as Lambda env JWT_SECRET; min 32 chars).
  S3BucketName:
    Type: String
    Description: Existing S3 bucket for uploads.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for Lambda (must reach RDS).
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Lambda ENIs (egress to RDS, S3, ECR).

Globals:
  Function:
    Timeout: 30
    MemorySize: 1536
    Tracing: Active

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Environment:
        Variables:
          ENV: production
          LOG_LEVEL: INFO
          AUTO_SYNC_PERMISSIONS: "true"
          TRUSTED_PROXY_COUNT: "1"
          DATABASE_HOST: !Ref DatabaseHost
          DATABASE_PORT: !Ref DatabasePort
          DATABASE_NAME: !Ref DatabaseName
          DATABASE_USER: !Ref DatabaseUser
          DATABASE_PASSWORD: !Ref DatabasePassword
          JWT_SECRET: !Ref JwtSecret
          DATABASE_POOL_SIZE: "2"
          DATABASE_MAX_OVERFLOW: "0"
          CORS_ORIGINS: !Ref CorsOrigins
          S3_BUCKET_NAME: !Ref S3BucketName
          AWS_REGION: !Ref AWS::Region
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
    Metadata:
      DockerTag: aagman-erp-api
      DockerContext: ../..
      Dockerfile: Dockerfile.lambda

Outputs:
  HttpApiUrl:
    Description: API Gateway HTTP API base URL (set Amplify API_URL to this).
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ApiFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ApiFunction.Arn
